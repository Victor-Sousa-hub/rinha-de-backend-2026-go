# worker_processes 1 porque o limite total de CPU é 1 core.
# O nginx em si usa ~0.05 CPU — o restante fica para as duas instâncias da API.
worker_processes 1;

events {
    # Máximo de conexões simultâneas por worker.
    # 1024 é suficiente para o volume da Rinha.
    worker_connections 1024;
}

http {
    # upstream define o pool de servidores para onde o nginx distribui as requisições.
    # Por padrão o nginx usa round-robin: manda req 1 → api1, req 2 → api2, req 3 → api1...
    upstream api {
        server api1:9999;
        server api2:9999;
    }

    server {
        # O nginx escuta na 9999 — é a porta exposta ao avaliador da Rinha.
        listen 9999;

        location / {
            proxy_pass http://api;

            # Repassa os headers originais para a API conseguir logar o IP real.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
