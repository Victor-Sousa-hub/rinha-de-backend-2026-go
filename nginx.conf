# worker_processes 1 porque o limite total de CPU é 1 core.
# O nginx em si usa ~0.05 CPU — o restante fica para as duas instâncias da API.
worker_processes 1;

events {
    # Máximo de conexões simultâneas por worker.
    # 1024 é suficiente para o volume da Rinha.
    worker_connections 1024;
}

http {
    access_log off;

    upstream api {
        least_conn;
        server unix:/sockets/api1.sock;
        server unix:/sockets/api2.sock;
        keepalive 64;
    }

    server {
        # O nginx escuta na 9999 — é a porta exposta ao avaliador da Rinha.
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }
    }
}
