name: rinha-2026

services:
  api1:
    build: .
    environment:
      # UDS elimina o stack TCP/IP entre nginx e API — sem handshake, sem buffer de rede.
      # O TCP :9999 ainda sobe num goroutine dedicado só para o HEALTHCHECK do Dockerfile.
      - ADDR=/sockets/api1.sock
      - WORKERS=4
      # Com UDS os requests são ultra-rápidos; um único OS thread elimina contention de
      # scheduler. Com TCP precisávamos de 4 para paralelizar os chunks do KNN.
      - GOMAXPROCS=1
      - NPROBE=2
      # GOGC=off desativa o GC — sem pauses = p99 estável.
      # GOMEMLIMIT funciona como safety net: o runtime ainda faz GC emergencial no limite.
      - GOGC=off
      - GOMEMLIMIT=140MiB
    volumes:
      - rinha-sockets:/sockets
    # Sem `ports`: a API não é exposta diretamente — só o nginx chega até ela.
    # cpu_period + cpu_quota encurtam o período CFS de 100ms → 10ms.
    # Com 100ms, os 4 goroutines esgotam a cota e pausam o container por ~90ms (p99 alto).
    # Com 10ms, o pior throttle cai para ~10ms. Total: 4250/10000 = 0.425 CPU.
    cpu_period: 10000
    cpu_quota: 4250
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: "200MB"

  api2:
    build: .
    environment:
      - ADDR=/sockets/api2.sock
      - WORKERS=4
      - GOMAXPROCS=1
      - NPROBE=2
      - GOGC=off
      - GOMEMLIMIT=140MiB
    volumes:
      - rinha-sockets:/sockets
    cpu_period: 10000
    cpu_quota: 4250
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: "200MB"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - rinha-sockets:/sockets
    ports:
      # 9999 é a porta obrigatória da Rinha exposta ao avaliador.
      - "9999:9999"
    # condition: service_healthy faz o nginx esperar o HEALTHCHECK das APIs passar
    # antes de iniciar — evita o erro "host not found in upstream" na resolução DNS.
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    cpu_period: 10000
    cpu_quota: 1500
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: "50MB"

networks:
  # bridge é o modo exigido pela spec da Rinha.
  backend:
    driver: bridge

volumes:
  rinha-sockets:
