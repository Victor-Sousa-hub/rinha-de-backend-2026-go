name: rinha-2026

services:
  api1:
    build: .
    environment:
      - WORKERS=2
      - QUEUE_CAP=64
    # Sem `ports`: a API não é exposta diretamente — só o nginx chega até ela.
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

  api2:
    build: .
    environment:
      - WORKERS=2
      - QUEUE_CAP=64
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # 9999 é a porta obrigatória da Rinha exposta ao avaliador.
      - "9999:9999"
    # condition: service_healthy faz o nginx esperar o HEALTHCHECK das APIs passar
    # antes de iniciar — evita o erro "host not found in upstream" na resolução DNS.
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "50MB"

networks:
  # bridge é o modo exigido pela spec da Rinha.
  backend:
    driver: bridge
